version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      - FRONTEND_URL=http://localhost:5173
      - NODE_ENV=production
      - PORT=3000

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    environment:
      - VITE_BACKEND_URL=http://localhost:3000
